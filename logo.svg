<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Midnight Deep Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070B11"/>
      <stop offset="50%" style="stop-color:#0B1522"/>
      <stop offset="100%" style="stop-color:#05090F"/>
    </linearGradient>
    
    <!-- Neon Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67E8F9"/>
      <stop offset="50%" style="stop-color:#00D2EE"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
    
    <!-- Soft Cyan Light -->
    <linearGradient id="cyanLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CFFAFE"/>
      <stop offset="100%" style="stop-color:#38BDF8"/>
    </linearGradient>

    <!-- Deep Blue Plate Grad -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#132235"/>
      <stop offset="100%" style="stop-color:#0D1724"/>
    </linearGradient>
    
    <!-- Intense Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Deep Circle Base -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="3.5" filter="url(#cyanGlow)"/>
  
  <!-- Outer Islamic Ring Pattern -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="10,6" opacity="0.45"/>
  <circle cx="256" cy="256" r="222" fill="url(#plateGrad)" stroke="#1E3349" stroke-width="1" opacity="0.7"/>

  <!-- Geometric Corner Ornaments (Cyan) -->
  <g opacity="0.6" fill="url(#cyanGrad)">
    <path d="M256,26 L263,48 L256,43 L249,48 Z"/>
    <path d="M256,486 L263,464 L256,469 L249,464 Z"/>
    <path d="M26,256 L48,249 L43,256 L48,263 Z"/>
    <path d="M486,256 L464,249 L469,256 L464,263 Z"/>
  </g>
  
  <!-- Open Book / Holy Quran -->
  <g transform="translate(256,195)" filter="url(#cyanGlow)">
    <!-- Left page -->
    <path d="M-8,-55 C-8,-55 -75,-50 -85,-30 C-95,-10 -90,45 -85,55 C-80,65 -8,58 -8,58 Z" 
          fill="#0D2436" stroke="url(#cyanGrad)" stroke-width="2.5"/>
    <!-- Right page -->
    <path d="M8,-55 C8,-55 75,-50 85,-30 C95,-10 90,45 85,55 C80,65 8,58 8,58 Z" 
          fill="#133047" stroke="url(#cyanGrad)" stroke-width="2.5"/>
    <!-- Spine -->
    <path d="M-8,-55 C-3,-50 3,-50 8,-55 L8,58 C3,55 -3,55 -8,58 Z" 
          fill="url(#cyanGrad)"/>
    <!-- Page lines left -->
    <g stroke="#38BDF8" stroke-width="1" opacity="0.7">
      <line x1="-70" y1="-20" x2="-18" y2="-22"/>
      <line x1="-72" y1="-8" x2="-18" y2="-10"/>
      <line x1="-74" y1="4" x2="-18" y2="2"/>
      <line x1="-75" y1="16" x2="-18" y2="14"/>
      <line x1="-74" y1="28" x2="-18" y2="26"/>
      <line x1="-72" y1="40" x2="-18" y2="38"/>
    </g>
    <!-- Page lines right -->
    <g stroke="#38BDF8" stroke-width="1" opacity="0.7">
      <line x1="70" y1="-20" x2="18" y2="-22"/>
      <line x1="72" y1="-8" x2="18" y2="-10"/>
      <line x1="74" y1="4" x2="18" y2="2"/>
      <line x1="75" y1="16" x2="18" y2="14"/>
      <line x1="74" y1="28" x2="18" y2="26"/>
      <line x1="72" y1="40" x2="18" y2="38"/>
    </g>
  </g>
  
  <!-- Glowing Crescent Moon & Star -->
  <g transform="translate(256,108)" filter="url(#cyanGlow)">
    <path d="M-15,-30 A25,25 0 1,0 -15,20 A18,18 0 1,1 -15,-30" 
          fill="url(#cyanGrad)"/>
    <!-- Glowing Star -->
    <path d="M18,-12 L20,-6 L26,-6 L21,-2 L23,4 L18,0 L13,4 L15,-2 L10,-6 L16,-6 Z" 
          fill="url(#cyanLight)"/>
  </g>
  
  <!-- Neon Dividing Bar -->
  <g transform="translate(256,285)" opacity="0.5" filter="url(#cyanGlow)">
    <rect x="-100" y="-1.5" width="200" height="3" rx="1.5" fill="url(#cyanGrad)"/>
    <circle cx="-105" cy="0" r="3.5" fill="#00D2EE"/>
    <circle cx="105" cy="0" r="3.5" fill="#00D2EE"/>
  </g>
  
  <!-- Text: Al-Qur'an -->
  <text x="256" y="332" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
        font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="2">
    Al-Qur'an
  </text>
  
  <!-- Text: Simple (Cyan Neon Pill Badge) -->
  <text x="256" y="368" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
        font-size="20" fill="#00D2EE" letter-spacing="8" font-weight="700">
    SIMPLE
  </text>
  
  <!-- Soundwave Equalizer Bars below text -->
  <g transform="translate(256,398)" opacity="0.85">
    <rect x="-35" y="-8" width="4" height="16" rx="2" fill="#00D2EE"/>
    <rect x="-25" y="-14" width="4" height="28" rx="2" fill="#38BDF8"/>
    <rect x="-15" y="-20" width="4" height="40" rx="2" fill="#00D2EE"/>
    <rect x="-5" y="-12" width="4" height="24" rx="2" fill="#67E8F9"/>
    <rect x="5" y="-22" width="4" height="44" rx="2" fill="#00D2EE"/>
    <rect x="15" y="-16" width="4" height="32" rx="2" fill="#38BDF8"/>
    <rect x="25" y="-10" width="4" height="20" rx="2" fill="#00D2EE"/>
  </g>
</svg>
