<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Midnight Deep Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080C14"/>
      <stop offset="50%" style="stop-color:#0D1726"/>
      <stop offset="100%" style="stop-color:#05080E"/>
    </linearGradient>
    
    <!-- Warm Orange to Soft Gold Gradient -->
    <linearGradient id="warmOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA751"/>
      <stop offset="50%" style="stop-color:#FF7A1A"/>
      <stop offset="100%" style="stop-color:#EA580C"/>
    </linearGradient>

    <!-- Soft Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE68A"/>
      <stop offset="50%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    
    <!-- Warm Light Accent -->
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF7ED"/>
      <stop offset="100%" style="stop-color:#FED7AA"/>
    </linearGradient>

    <!-- Deep Navy Plate Grad -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#162338"/>
      <stop offset="100%" style="stop-color:#0F1826"/>
    </linearGradient>
    
    <!-- Warm Orange Glow Filter -->
    <filter id="warmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Deep Circle Base -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)" stroke="url(#warmOrangeGrad)" stroke-width="3.5" filter="url(#warmGlow)"/>
  
  <!-- Outer Islamic Ring Pattern -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="10,6" opacity="0.5"/>
  <circle cx="256" cy="256" r="222" fill="url(#plateGrad)" stroke="#23354E" stroke-width="1" opacity="0.8"/>

  <!-- Geometric Corner Ornaments (Warm Orange / Gold) -->
  <g opacity="0.75" fill="url(#goldGrad)">
    <path d="M256,26 L263,48 L256,43 L249,48 Z"/>
    <path d="M256,486 L263,464 L256,469 L249,464 Z"/>
    <path d="M26,256 L48,249 L43,256 L48,263 Z"/>
    <path d="M486,256 L464,249 L469,256 L464,263 Z"/>
  </g>
  
  <!-- Open Book / Holy Quran -->
  <g transform="translate(256,195)" filter="url(#warmGlow)">
    <!-- Left page -->
    <path d="M-8,-55 C-8,-55 -75,-50 -85,-30 C-95,-10 -90,45 -85,55 C-80,65 -8,58 -8,58 Z" 
          fill="#1E1926" stroke="url(#warmOrangeGrad)" stroke-width="2.5"/>
    <!-- Right page -->
    <path d="M8,-55 C8,-55 75,-50 85,-30 C95,-10 90,45 85,55 C80,65 8,58 8,58 Z" 
          fill="#271E2F" stroke="url(#warmOrangeGrad)" stroke-width="2.5"/>
    <!-- Spine -->
    <path d="M-8,-55 C-3,-50 3,-50 8,-55 L8,58 C3,55 -3,55 -8,58 Z" 
          fill="url(#goldGrad)"/>
    <!-- Page lines left -->
    <g stroke="#FDBA74" stroke-width="1" opacity="0.75">
      <line x1="-70" y1="-20" x2="-18" y2="-22"/>
      <line x1="-72" y1="-8" x2="-18" y2="-10"/>
      <line x1="-74" y1="4" x2="-18" y2="2"/>
      <line x1="-75" y1="16" x2="-18" y2="14"/>
      <line x1="-74" y1="28" x2="-18" y2="26"/>
      <line x1="-72" y1="40" x2="-18" y2="38"/>
    </g>
    <!-- Page lines right -->
    <g stroke="#FDBA74" stroke-width="1" opacity="0.75">
      <line x1="70" y1="-20" x2="18" y2="-22"/>
      <line x1="72" y1="-8" x2="18" y2="-10"/>
      <line x1="74" y1="4" x2="18" y2="2"/>
      <line x1="75" y1="16" x2="18" y2="14"/>
      <line x1="74" y1="28" x2="18" y2="26"/>
      <line x1="72" y1="40" x2="18" y2="38"/>
    </g>
  </g>
  
  <!-- Glowing Crescent Moon & Star -->
  <g transform="translate(256,108)" filter="url(#warmGlow)">
    <path d="M-15,-30 A25,25 0 1,0 -15,20 A18,18 0 1,1 -15,-30" 
          fill="url(#warmOrangeGrad)"/>
    <!-- Glowing Star -->
    <path d="M18,-12 L20,-6 L26,-6 L21,-2 L23,4 L18,0 L13,4 L15,-2 L10,-6 L16,-6 Z" 
          fill="url(#warmLight)"/>
  </g>
  
  <!-- Warm Dividing Bar -->
  <g transform="translate(256,285)" opacity="0.6" filter="url(#warmGlow)">
    <rect x="-100" y="-1.5" width="200" height="3" rx="1.5" fill="url(#warmOrangeGrad)"/>
    <circle cx="-105" cy="0" r="3.5" fill="#FF7A1A"/>
    <circle cx="105" cy="0" r="3.5" fill="#FF7A1A"/>
  </g>
  
  <!-- Text: Al-Qur'an -->
  <text x="256" y="332" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
        font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="2">
    Al-Qur'an
  </text>
  
  <!-- Text: Simple (Warm Orange Gradient Pill Badge) -->
  <text x="256" y="368" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
        font-size="20" fill="#FF7A1A" letter-spacing="8" font-weight="700">
    SIMPLE
  </text>
  
  <!-- Soundwave Equalizer Bars below text (Warm Orange & Gold) -->
  <g transform="translate(256,398)" opacity="0.9">
    <rect x="-35" y="-8" width="4" height="16" rx="2" fill="#EA580C"/>
    <rect x="-25" y="-14" width="4" height="28" rx="2" fill="#FF7A1A"/>
    <rect x="-15" y="-20" width="4" height="40" rx="2" fill="#F59E0B"/>
    <rect x="-5" y="-12" width="4" height="24" rx="2" fill="#FCD34D"/>
    <rect x="5" y="-22" width="4" height="44" rx="2" fill="#F59E0B"/>
    <rect x="15" y="-16" width="4" height="32" rx="2" fill="#FF7A1A"/>
    <rect x="25" y="-10" width="4" height="20" rx="2" fill="#EA580C"/>
  </g>
</svg>
